name: Godot Android Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GODOT_VERSION: "4.2.2"
      GODOT_FLAVOR: "stable"
      GODOT_EDITOR_ZIP: "Godot_v4.2.2-stable_linux.x86_64.zip"
      GODOT_EDITOR_BIN: "Godot_v4.2.2-stable_linux.x86_64"
      GODOT_TEMPLATES_TPZ: "Godot_v4.2.2-stable_export_templates.tpz"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore signing keystore from secret
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p "${HOME}/.android"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${HOME}/.android/debug.keystore"
          : > "${HOME}/.android/use-secret-keystore"

      - name: Restore debug keystore
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Clear Godot cache
        run: |
          rm -rf ~/.config/godot
          rm -rf ~/.local/share/godot

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;23.2.8568313"

      - name: Download Godot Editor
        run: |
          wget --content-disposition --trust-server-names -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_FLAVOR}/${GODOT_EDITOR_ZIP}"
          unzip -q "${GODOT_EDITOR_ZIP}"
          chmod +x "${GODOT_EDITOR_BIN}"

      - name: Download Export Templates
        run: |
          wget --content-disposition --trust-server-names -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_FLAVOR}/${GODOT_TEMPLATES_TPZ}"
          mkdir -p "${HOME}/.local/share/godot/export_templates/4.2.2.stable"
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q "${GODOT_TEMPLATES_TPZ}" -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/. "${HOME}/.local/share/godot/export_templates/4.2.2.stable/"
          test -f "${HOME}/.local/share/godot/export_templates/4.2.2.stable/android_debug.apk"
          test -f "${HOME}/.local/share/godot/export_templates/4.2.2.stable/android_release.apk"

      - name: Create debug keystore
        run: |
          mkdir -p "${HOME}/.android"
          if [ ! -f "${HOME}/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "${HOME}/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -noprompt
          fi

      - name: Export signed Android APK
        env:
          KEYSTORE_USER: ${{ secrets.KEYSTORE_USER }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_USER}" ]; then
            keystore_user="${KEYSTORE_USER}"
          elif [ -f "${HOME}/.android/use-secret-keystore" ]; then
            keystore_user="mykey"
          else
            keystore_user="androiddebugkey"
          fi

          if [ -n "${KEYSTORE_PASSWORD}" ]; then
            keystore_password="${KEYSTORE_PASSWORD}"
          elif [ -f "${HOME}/.android/use-secret-keystore" ]; then
            keystore_password="micklab"
          else
            keystore_password="android"
          fi
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="${HOME}/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="${keystore_user}"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="${keystore_password}"
          mkdir -p build/android
          ./"${GODOT_EDITOR_BIN}" --headless --path . --export-debug "Android" build/android/game.apk
          "${ANDROID_SDK_ROOT}/build-tools/33.0.2/apksigner" verify --verbose build/android/game.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: android-debug-apk
          path: build/android/game.apk
          if-no-files-found: error