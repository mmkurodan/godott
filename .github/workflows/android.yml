name: Godot Android Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GODOT_VERSION: "4.2.2"
      GODOT_FLAVOR: "stable"
      GODOT_EDITOR_ZIP: "Godot_v4.2.2-stable_linux.x86_64.zip"
      GODOT_EDITOR_BIN: "Godot_v4.2.2-stable_linux.x86_64"
      GODOT_TEMPLATES_TPZ: "Godot_v4.2.2-stable_export_templates.tpz"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-33" \
            "platforms;android-34" \
            "build-tools;33.0.2" \
            "build-tools;34.0.0" \
            "ndk;23.2.8568313"

      - name: Download Godot Editor
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_FLAVOR}/${GODOT_EDITOR_ZIP}"
          unzip -q "${GODOT_EDITOR_ZIP}"
          chmod +x "${GODOT_EDITOR_BIN}"

      - name: Download Export Templates
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_FLAVOR}/${GODOT_TEMPLATES_TPZ}"
          mkdir -p "${HOME}/.local/share/godot/export_templates/4.2.2.stable"
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q "${GODOT_TEMPLATES_TPZ}" -d /tmp/godot-templates
          cp -R /tmp/godot-templates/* "${HOME}/.local/share/godot/export_templates/4.2.2.stable/"

      - name: Clear Godot cache
        run: |
          rm -rf ~/.config/godot
          rm -rf ~/.local/share/godot

      - name: Export Android APK
        run: |
          mkdir -p build/android
          ./"${GODOT_EDITOR_BIN}" --headless --path . --export-release "Android" build/android/game.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: android-apk
          path: build/android/game.apk
          if-no-files-found: error