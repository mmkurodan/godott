name: Godot Android Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Godot 4.x の固定バージョンです。
      GODOT_VERSION: "4.2.2"
      GODOT_FLAVOR: "stable"
      GODOT_EDITOR_ZIP: "Godot_v4.2.2-stable_linux.x86_64.zip"
      GODOT_EDITOR_BIN: "Godot_v4.2.2-stable_linux.x86_64"
      GODOT_TEMPLATES_TPZ: "Godot_v4.2.2-stable_export_templates.tpz"

    steps:
      - name: Checkout
        # Termux から push された内容をそのまま取得します。
        uses: actions/checkout@v5

      - name: Download Godot Editor
        # Linux x86_64 版の Godot Editor を取得し、
        # headless export に使えるように実行権限を付けます。
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_FLAVOR}/${GODOT_EDITOR_ZIP}"
          unzip -q "${GODOT_EDITOR_ZIP}"
          chmod +x "${GODOT_EDITOR_BIN}"

      - name: Download Export Templates
        # Godot 4.x は ~/.local/share/godot/export_templates/<version>.stable/
        # に templates を置くと headless export で参照できます。
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_FLAVOR}/${GODOT_TEMPLATES_TPZ}"
          mkdir -p "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_FLAVOR}"
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q "${GODOT_TEMPLATES_TPZ}" -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/* "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_FLAVOR}/"

      - name: Export Android APK
        # export_presets.cfg の Android プリセット名と一致させて、
        # unsigned APK を build/android/game.apk に出力します。
        run: |
          mkdir -p build/android
          ./"${GODOT_EDITOR_BIN}" --headless --path . --export-release "Android" build/android/game.apk

      - name: Upload Artifact
        # 生成された APK を GitHub Actions の artifact として保存します。
        uses: actions/upload-artifact@v4.6.2
        with:
          name: android-apk
          path: build/android/game.apk
          if-no-files-found: error
